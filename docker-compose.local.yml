# Local HireOS for OpenClaw: same image as Fly, using this machine's DB, output and local LLM.
#   docker compose -f docker-compose.local.yml up -d --build
# UI + API: http://172.17.0.1:8011  (OpenClaw reaches it as host.docker.internal:8011)
services:
  hireos:
    build: .
    container_name: hireos-local
    # Host network so Settings' Local LLM URL http://localhost:8080/v1 reaches llama.cpp unchanged.
    network_mode: host
    # Docker bridge address only: reachable from the host and from containers, not from the LAN.
    command: ["uvicorn", "main:app", "--host", "172.17.0.1", "--port", "8011", "--workers", "1"]
    # ponytail: runs as your uid so DB/output files stay yours; Playwright's Chromium (installed under /root) is then unusable here
    user: "1000:1000"
    environment:
      - HOME=/tmp
      - PYTHONUNBUFFERED=1
      - DATABASE_URL=sqlite:////data/swarm.db
      - OUTPUT_DIR=/data/output
      - CHROMA_PATH=/data/output/chroma
      - LOG_DIR=/data/logs
      - LOCAL_LLM_URL=http://127.0.0.1:8080/v1
      # Background jobs (backend/scheduler.py): alerts, Gmail status scan. This instance only, never Fly.
      - SCHEDULER=on
      - GMAIL_USER_ID=1                # the HireOS user the Gmail mailbox in .env belongs to
      - OPS_DIR=/data/output/ops       # scripts/backup_db.sh writes backup.ok / backup.alert here
    volumes:
      - ./backend/.env:/app/.env:ro
      - ./backend:/data   # swarm.db + output/ live here
    restart: unless-stopped
    # Docker keeps container output forever by default; cap it (5 x 20 MB).
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "5" }
