app = "hireos"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  CHROMA_PATH = "/app/data/chroma"
  OUTPUT_DIR = "/app/data/output"
  DATABASE_URL = "sqlite:////app/data/swarm.db"
  # Exact URLs allowed to receive an auth token after SSO, for clients that
  # aren't the web app. Exact match only — see _allowed_return_to.
  OAUTH_RETURN_ALLOWLIST = "https://hireos-mcp.fly.dev/oauth/sso-return"
  # The one instance that runs the background loops (discovery, Gmail scan, alerts, chat bots'
  # pushes). Exactly one machine: two would double every alert and fight over the bot tokens.
  SCHEDULER = "on"
  GMAIL_USER_ID = "1"
  # No local model here: the model until a user picks one in Settings › AI Model (it then
  # applies everywhere for them, Gmail reading included)
  DEFAULT_LLM = "openrouter:qwen/qwen3.8-27b"

[[mounts]]
  source = "hireos_data"
  destination = "/app/data"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "30s"
    timeout = "10s"
    grace_period = "20s"
    method = "GET"
    path = "/api/health"

[[vm]]
  memory = "2gb"   # API + scheduler + Telegram/Discord bots + discovery in one machine
  cpu_kind = "shared"
  cpus = 1
